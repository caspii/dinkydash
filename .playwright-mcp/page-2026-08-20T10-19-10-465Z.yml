        - generic [ref=f5e95]:
          - heading "Want this on your kitchen wall every morning?" [level=2] [ref=f5e96]
          - paragraph [ref=f5e97]: That's DinkyDash. The same countdowns, plus today's calendar events, a chore chart that rotates itself, and a short daily brief written for your family — on any old tablet, TV or Raspberry Pi you already own. Free and open source.
          - link "See how it works" [ref=f5e98] [cursor=pointer]:
            - /url: /diy-skylight-calendar/
      - paragraph [ref=f5e35]: Pick a birthday above and the counter shows exactly how many days are left, ticking down to the hour. Add everyone in the family and you get the whole year at a glance.
      - paragraph [ref=f5e36]: There's no sign-up and nothing gets uploaded — the countdown lives in the link and in your own browser, so you can bookmark it, put it on your phone's home screen, or paste it into the family group chat.
      - heading "How many days until my birthday?" [level=2] [ref=f5e37]
      - paragraph [ref=f5e38]: Count from today to your next birthday. If it's already been this year, you're counting to next year's — which is why the number can jump from 1 to 364 overnight.
      - paragraph [ref=f5e39]: "The counter above does this for you, but the arithmetic that trips people up is the year boundary: from 20 August to 15 March is 207 days, not the 158 you'd get by subtracting the dates and ignoring the year change."
      - heading "Adding the whole family" [level=2] [ref=f5e40]
      - paragraph [ref=f5e41]: You're not limited to one. Add a birthday, then add another — everyone stacks up in the same countdown, sorted so the next one coming is always the big number at the top.
      - paragraph [ref=f5e42]: That's the point at which it stops being a countdown and starts being a calendar, which is rather the idea.
      - heading "Sharing a countdown" [level=2] [ref=f5e43]
      - paragraph [ref=f5e44]:
        - text: Every countdown you build gets its own link, and that link opens
        - strong [ref=f5e45]: full screen
        - text: — just the numbers, no menus and no page around them. It's meant to be sent to someone, or left open on a spare tablet or TV.
      - paragraph [ref=f5e46]:
        - text: Copy it and whoever opens it sees the same countdown you do, ticking live from their own clock. Use
        - strong [ref=f5e47]: Open full screen
        - text: to put it up on your own screen.
      - paragraph [ref=f5e48]: The link holds the names and dates, so nothing is stored on our end and nothing expires. A countdown you share today still works next year — it'll just be counting to the next birthday.
      - paragraph [ref=f5e49]: If you'd rather not put a birth year in a shared link, leave the year blank. You'll still get the countdown, just without the "turning 12" line.
      - heading "What about 29 February?" [level=2] [ref=f5e50]
      - paragraph [ref=f5e51]: Leap-day birthdays get counted properly here, which is more than a lot of countdown tools manage — plenty of them either crash or quietly skip to 1 March.
      - paragraph [ref=f5e52]:
        - text: In a leap year the countdown runs to 29 February. In every other year it runs to
        - strong [ref=f5e53]: 28 February
        - text: ", so the number hits zero in the month the family actually celebrates. That's also the convention most countries use for legal purposes."
      - heading "Questions" [level=2] [ref=f5e54]
      - paragraph [ref=f5e55]:
        - strong [ref=f5e56]: Is this free?
        - text: Yes, and there's no account. It's a small tool from
        - link "DinkyDash" [ref=f5e57] [cursor=pointer]:
          - /url: https://github.com/caspii/dinkydash
        - text: ", our open-source family calendar."
      - paragraph [ref=f5e58]:
        - strong [ref=f5e59]: Does the countdown keep running if I close the tab?
        - text: It picks up where it left off. Your countdowns are saved in your own browser, so the page remembers them next time. Clearing your browser data clears them too — keep the link if you want a permanent copy.
      - paragraph [ref=f5e60]:
        - strong [ref=f5e61]: Can I count down to something that isn't a birthday?
        - text: "Anything that happens on the same date every year works: anniversaries, holidays, the last day of school. Put the name in the name field and it'll count down all the same."
      - paragraph [ref=f5e62]:
        - strong [ref=f5e63]: How many people can I add?
        - text: As many as you like. Past three or four the list is more useful than the big number, which is roughly the point at which you might want it on a screen instead of in a browser tab.
      - paragraph [ref=f5e64]:
        - strong [ref=f5e65]: Why does it say 364 days and not 365?
        - text: Because it counts whole days from today. The day after your birthday, there are 364 sleeps until the next one — 365 in a leap year, or if a 29 February falls in between.
      - paragraph [ref=f5e66]:
        - strong [ref=f5e67]: Does it work offline?
        - text: Once the page has loaded, yes. All the arithmetic happens in your browser.
      - heading "Every birthday, on the kitchen wall" [level=2] [ref=f5e68]
      - paragraph [ref=f5e69]: A browser tab is a fine place for one countdown. It's a bad place for the eight your family actually cares about — nobody opens a tab to find out whose birthday is coming up.
      - paragraph [ref=f5e70]:
        - text: That's what
        - link "DinkyDash" [ref=f5e71] [cursor=pointer]:
          - /url: /diy-skylight-calendar/
        - text: is for. It's a free, open-source family dashboard that turns any old tablet, spare monitor or
        - link "Raspberry Pi" [ref=f5e72] [cursor=pointer]:
          - /url: /raspberry-pi-family-calendar/
        - text: into a screen on the kitchen wall showing today's calendar events, a chore chart that rotates between the kids, every birthday countdown, and a short daily brief written fresh each morning.
      - paragraph [ref=f5e73]: It's the same countdowns you just made, somewhere the family will actually see them.
