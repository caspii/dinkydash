# Runs on every push and pull request. Two independent jobs, so a secret in a
# commit and a broken test are separate red X's rather than one.
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    # A real Postgres, so the store tests run twice — once over FileStore and
    # once over PostgresStore, with the same assertions. A suite that only ever
    # ran against files would not notice the day the two drifted apart.
    services:
      postgres:
        # Pinned to the major version DigitalOcean's managed cluster runs, which
        # is **17** — the `dinkydash` cluster in fra1 is on 17.11 as of
        # 8 September 2026. This said 16 until then, written before the cluster
        # existed, so CI was proving migrations against a major the app does not
        # run. Postgres 15 changed who may write to the `public` schema; a
        # difference of that size passing here and failing in production is
        # exactly what this service container exists to prevent.
        #
        # When the cluster is upgraded, this line moves with it. `doctl
        # databases get <id> --format VersionSlug` is the check.
        image: postgres:17
        env:
          POSTGRES_USER: dinkydash
          POSTGRES_PASSWORD: dinkydash
          POSTGRES_DB: dinkydash_test
        ports:
          - 5432:5432
        # Without this the job races the container and the first connection
        # fails on a database that is seconds from being ready.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version the Pi runs and the version the tests are written
          # against. strftime("%-d") is glibc-specific, so this must stay Linux.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-cloud.txt

      # requirements-dev.txt pulls in requirements.txt, so this installs both.
      # requirements-cloud.txt adds psycopg, which is deliberately not in
      # either — a Pi has no database and should not carry a driver for one.
      - run: pip install -r requirements-dev.txt -r requirements-cloud.txt

      # The password is the service container's own, invented above and
      # reachable only from this job — but it goes in PGPASSWORD rather than
      # inline in the URL, because `user:pass@host` is the shape a secret
      # scanner looks for and a build that cries wolf gets ignored.
      - name: Run the tests, both backends
        env:
          PGPASSWORD: dinkydash
          DINKYDASH_TEST_DATABASE_URL: postgresql://dinkydash@localhost:5432/dinkydash_test
        run: python -m pytest tests/ -q

      # The suite a self-hoster actually runs: no database, no psycopg. The
      # Postgres tests skip, and everything else has to still pass.
      - name: Run the tests as a self-hoster does
        run: python -m pytest tests/ -q

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. gitleaks scans commits, not the working tree, so a
          # shallow clone would only ever look at the tip.
          fetch-depth: 0

      # The upstream gitleaks-action is a bundled JavaScript blob under a
      # commercial licence. gitleaks itself is MIT and ships a static binary,
      # so run that instead — one fewer thing with a token in our CI. Pinned,
      # for the same reason requirements.txt is.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Rules and the one allowlisted public value live in .gitleaks.toml.
      - run: gitleaks git --redact --exit-code 1 --config .gitleaks.toml .
