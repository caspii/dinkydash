"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"

# config.yaml is gitignored, so it only lands in a new workspace if Files to
# copy brought it across. Fall back to the example, otherwise the board raises
# FileNotFoundError on the first request.
setup = """
set -e
python3 -m venv venv
venv/bin/pip install -q -r requirements-dev.txt
[ -f config.yaml ] || cp config.example.yaml config.yaml
"""

[scripts.run.dashboard]
command = "FLASK_APP=app.py venv/bin/flask run --port ${CONDUCTOR_PORT:-5000} --debug"
default = true
icon = "monitor"

[scripts.run.generate]
command = "venv/bin/python generate.py"
icon = "sparkles"

[scripts.run.website]
command = "cd website && ../venv/bin/python build.py"
icon = "globe"
