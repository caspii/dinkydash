{% extends "settings/base.html" %}
{% block title %}{{ prompt.title }}{% endblock %}
{% set back_href = cancel_url %}
{% set back_label = 'Cancel' %}
{% block content %}
<div class="note-box">{{ prompt.message }}</div>
<form method="post" class="confirmation-actions">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="confirmed" value="yes">
    {% for name, value in fields.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <a class="btn outline" href="{{ cancel_url }}">{{ prompt.cancel }}</a>
    <button class="btn danger fill" type="submit">{{ prompt.confirm }}</button>
</form>
{% endblock %}
