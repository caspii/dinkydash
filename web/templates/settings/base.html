<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Settings{% endblock %} · DinkyDash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <!-- Saved to a phone's home screen this opens like an app. The manifest is
         what Android reads; iOS ignores it and goes by the four lines below.
         A block, because the login page is behind no session and the manifest
         is: fetching it there would only ever be a redirect. -->
    {% block manifest %}<link rel="manifest" href="{{ url_for('settings.manifest') }}">{% endblock %}
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-title" content="DinkyDash">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#fffaf5">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
    <style>
        :root {
            --bg: #fffaf5;
            --surface: #ffffff;
            --warm: #fff5ec;
            --border: #f0e6da;
            --border-strong: #e2d7c9;
            --text: #2d2319;
            --text-mid: #5c4a3a;
            --text-muted: #9a8677;
            --faint: #c4b3a3;
            --accent: #e85d24;
            --accent-dark: #c44d1a;
            --purple: #7c5cbf;
            --green: #16a34a;
            --amber: #d97706;
            --amber-dark: #b45309;
            --danger: #c0392b;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        /* An inline `display` beats the browser's own [hidden] rule, so say it here. */
        [hidden] { display: none !important; }
        /* Everything below is sized in rem off this one value, like the board. A phone gets the
           mockup's 16px; a desktop browser gets up to 20px, so the same layout reads at arm's
           length instead of phone distance. Stated in rem, not px, so a raised browser default
           still wins. Borders and focus rings stay in px — hairlines should not scale. */
        html { font-size: clamp(1rem, 0.75rem + 0.625vw, 1.25rem); }
        body {
            font-family: 'Nunito', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        /* Built for a phone; on anything wider it just centres. */
        .shell { max-width: 28.75rem; margin: 0 auto; min-height: 100vh; background: var(--bg); }
        a { color: var(--accent); text-decoration: none; }

        .appbar {
            display: flex; align-items: center; gap: 0.25rem;
            height: 3.5rem; padding: 0 0.75rem;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: var(--bg); z-index: 5;
        }
        .appbar h1 { font-size: 1.0625rem; font-weight: 800; letter-spacing: -0.01em; flex-grow: 1; }
        .appbar .back, .appbar .action {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 2.75rem; height: 2.75rem; color: var(--text-mid);
        }
        .appbar .action { font-size: 0.9375rem; font-weight: 800; color: var(--accent); padding: 0 0.375rem; }
        .appbar .action.muted { color: var(--text-muted); font-weight: 700; }

        .content { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; }
        .card.pad { padding: 0.9375rem; }
        .row {
            display: flex; align-items: center; gap: 0.8125rem;
            padding: 0.75rem 0.875rem; min-height: 3.875rem;
            color: inherit;
        }
        .row + .row { border-top: 1px solid var(--border); }
        .row-main { flex-grow: 1; min-width: 0; }
        .row-title { font-size: 0.9375rem; font-weight: 700; }
        .row-sub { font-size: 0.8125rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }
        .chev { flex-shrink: 0; color: var(--faint); }

        .avatar {
            width: 2.875rem; height: 2.875rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0; background: rgba(154, 134, 119, 0.12);
        }
        .avatar.purple { background: rgba(124, 92, 191, 0.14); }
        .avatar.blue   { background: rgba(59, 130, 246, 0.14); }
        .avatar.green  { background: rgba(22, 163, 74, 0.13); }
        .avatar.pink   { background: rgba(219, 39, 119, 0.11); }
        .avatar.orange { background: rgba(232, 93, 36, 0.11); }
        .avatar.amber  { background: rgba(217, 119, 6, 0.13); }
        .avatar.teal   { background: rgba(13, 148, 136, 0.13); }
        .avatar.square { border-radius: 0.8125rem; }

        .label {
            font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
            padding: 0 0.25rem 0.5rem;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            width: 100%; height: 3rem; border-radius: 0.75rem; border: none;
            font-family: inherit; font-size: 0.9375rem; font-weight: 700;
            background: var(--accent); color: #fff; cursor: pointer;
            box-shadow: 0 2px 8px rgba(232, 93, 36, 0.25);
        }
        .btn.outline { background: transparent; color: var(--text); border: 2px solid var(--border); box-shadow: none; }
        .btn.dashed { background: transparent; color: var(--text-mid); border: 2px dashed var(--border-strong); box-shadow: none; height: 3.25rem; }
        .btn.danger { background: transparent; color: var(--danger); box-shadow: none; font-weight: 700; }
        .btn.small { height: 2.5rem; font-size: 0.875rem; width: auto; padding: 0 1rem; }

        .field { display: flex; flex-direction: column; gap: 0.375rem; }
        .field > label { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
        .field input[type=text], .field input[type=url], .field input[type=date],
        .field input[type=time], .field input[type=email],
        .field select, .field textarea {
            width: 100%; min-height: 3rem; padding: 0.75rem 0.875rem;
            border: 1.5px solid var(--border); border-radius: 0.75rem;
            background: var(--surface); color: var(--text);
            font-family: inherit; font-size: 0.9375rem; font-weight: 600;
        }
        .field textarea { min-height: 4.75rem; resize: vertical; }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none; border-color: var(--accent);
        }
        .hint { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; }

        .picker { display: flex; flex-wrap: wrap; gap: 0.4375rem; }
        .picker input { position: absolute; opacity: 0; pointer-events: none; }
        .picker label {
            display: flex; align-items: center; justify-content: center;
            min-width: 2.875rem; height: 2.875rem; padding: 0 0.625rem;
            border: 1.5px solid var(--border); border-radius: 0.75rem;
            font-size: 1.3rem; cursor: pointer; background: var(--surface);
        }
        .picker input:checked + label { border: 2px solid var(--accent); background: rgba(232, 93, 36, 0.06); }
        .swatch { width: 2.125rem; height: 2.125rem; border-radius: 50%; display: block; }
        .picker.colors label { min-width: 2.875rem; height: 2.875rem; border-radius: 50%; border: none; padding: 0; }
        .picker.colors input:checked + label { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

        .checkline { display: flex; align-items: center; gap: 0.6875rem; padding: 0.375rem 0.125rem; }
        .checkline input { width: 1.375rem; height: 1.375rem; accent-color: var(--accent); }
        .checkline span { font-size: 0.9375rem; font-weight: 700; }

        .note-box { background: var(--warm); border-radius: 0.875rem; padding: 0.8125rem 0.9375rem; font-size: 0.8125rem; color: var(--text-mid); line-height: 1.55; }
        .flash { border-radius: 0.875rem; padding: 0.8125rem 0.9375rem; font-size: 0.875rem; font-weight: 700; }
        .flash.ok { background: rgba(22, 163, 74, 0.1); color: #15803d; }
        .flash.error { background: rgba(192, 57, 43, 0.09); color: var(--danger); }
        .problems { background: rgba(192, 57, 43, 0.07); border-radius: 0.875rem; padding: 0.8125rem 0.9375rem; color: var(--danger); font-size: 0.8125rem; }
        .problems li { margin-left: 1.125rem; }

        .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; display: inline-block; }
        .dot.ready { background: var(--green); }
        .dot.stale { background: var(--amber); }
        .dot.waiting { background: var(--faint); }

        .pill { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.1875rem 0.625rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 800; }
        .pill.warm { background: rgba(232, 93, 36, 0.1); color: var(--accent-dark); }
        .pill.muted { background: rgba(154, 134, 119, 0.12); color: var(--text-mid); }

        .inline-form { display: inline; }
        .move { display: flex; flex-direction: column; gap: 0.125rem; }
        .move button {
            width: 1.875rem; height: 1.5rem; border: 1px solid var(--border); background: var(--surface);
            border-radius: 0.4375rem; cursor: pointer; color: var(--text-muted); font-size: 0.7rem; line-height: 1;
        }
    </style>
</head>
<body>
<div class="shell">
    <div class="appbar">
        {% block appbar %}{% endblock %}
    </div>
    <div class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
