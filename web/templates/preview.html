<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Dashboard preview · DinkyDash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    {% include "_fonts.html" %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: #2d2823; color: #c9bcae;
            padding: 1rem; display: flex; flex-wrap: wrap;
            gap: 2rem; align-items: flex-start; justify-content: center;
        }
        figure { display: flex; flex-direction: column; gap: 0.625rem; width: min(100%, var(--preview-width)); min-width: 0; }
        .frame {
            background: #fff; border: 10px solid #17140f; border-radius: 14px;
            overflow: hidden; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
        }
        .viewport { position: relative; width: 100%; aspect-ratio: var(--device-ratio); overflow: hidden; }
        iframe { position: absolute; top: 0; left: 0; display: block; border: 0; width: 100%; height: 100%; transform-origin: top left; }
        figcaption { font-size: 0.8125rem; text-align: center; letter-spacing: 0.03em; }
        a { color: #ff9a6b; }
        a:hover { text-decoration: underline; }
        a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
        .bar { width: 100%; text-align: center; font-size: 0.875rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    </style>
</head>
<body>
<nav class="bar" aria-label="Preview navigation">
    <a href="{{ url_for('settings.home') }}">&larr; Settings</a>
    <a href="{{ board_url }}" target="_blank" rel="noopener">Open dashboard in a new tab</a>
</nav>
{% for label, width, height in sizes %}
<figure style="--preview-width: {{ (width * 0.62 + 20) | round | int }}px; --device-ratio: {{ width }} / {{ height }};">
    <div class="frame">
        <div class="viewport">
            <iframe src="{{ board_url }}" title="{{ label }} dashboard preview"
                    data-width="{{ width }}" data-height="{{ height }}"></iframe>
        </div>
    </div>
    <figcaption>{{ label }} &mdash; {{ width }} &times; {{ height }}</figcaption>
</figure>
{% endfor %}
<script src="{{ static_url('preview.js') }}" defer></script>
</body>
</html>
