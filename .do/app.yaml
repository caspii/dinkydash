# DigitalOcean App Platform spec for dinkydash.co and app.dinkydash.co.
#
# App id: ed4158fc-fb49-4c10-bb1e-2c8491b06a86. **How to apply it is below, and
# it is not `--spec .do/app.yaml`** — read the secrets note before running
# anything.
#
# Infrastructure reviewed like code, which is why it is committed.
#
# **This spec is the whole app, not a patch.** `doctl apps update` replaces what
# is there, so anything missing from this file is deleted from the running app.
# `domains` is written out for that reason — it was absent until 8 September
# 2026, and applying the file as documented above would have taken dinkydash.co
# off its own domain.
#
# **Do not apply this file as it stands. It will break the app.**
#
# The `type: SECRET` entries below carry no `value:`, because their values are
# production credentials and this repo is world-readable. Applying a spec that
# omits them looks like it works — `doctl apps spec get` still shows `EV[...]`
# afterwards, so the secret appears to have been preserved — but **the container
# receives an empty variable**, and the pre-deploy migration job dies with
# `DATABASE_URL_DIRECT is not set`. That was learned by doing it: two deploys
# failed that way on 8 September 2026, and the spec looked correct throughout.
# A canary test that only checked `spec get` is what missed it; the display and
# the runtime disagree.
#
# So this file is the **shape** of the app, reviewed like code, and the values
# are merged in at apply time from outside the working tree:
#
#   python3 - <<'EOF'
#   import os, yaml
#   d = yaml.safe_load(open(".do/app.yaml"))
#   for e in d["envs"]:
#       if e.get("type") == "SECRET":
#           e["value"] = os.environ[e["key"]]      # from .env, never committed
#   yaml.safe_dump(d, open("/tmp/apply.yaml", "w"), sort_keys=False)
#   EOF
#   doctl apps update <APP_ID> --spec /tmp/apply.yaml && rm /tmp/apply.yaml
#
# **Never commit an `EV[...]` blob here either** — it is ciphertext of a
# production credential, in a public repo.
#
# **The alert block below is applied by the same command**, and App Platform
# keeps the alert's *destinations* outside the spec: an alert created this way
# arrives addressed to the account owner (one email, as `doctl apps list-alerts
# <APP_ID>` shows), and `doctl apps update-alert-destinations <APP_ID> <ALERT_ID>
# --app-alert-destinations <file>` is how it gets more. See doc/operations.md,
# Sentry and the deploy alert.
#
# No Dockerfile: App Platform's Python buildpack reads .python-version and
# installs what `build_command` says (DIN-30, reversed).
#
# One service serves both hostnames. `wsgi.py` routes on the `Host` header —
# dinkydash.co to the marketing site, app.dinkydash.co to the dashboard — because
# qrpage.co and abc-league already run one container each in this account and a
# second service is $5/month for isolation with no revenue behind it yet. See
# PLAN.md, Hosting and deployment.
#
# **The `worker` component and `worker/` land in the same commit.** Applying
# this file from a checkout that predates the package gives a component whose
# run_command cannot import, and a failed deploy.

name: dinkydash-site
region: fra

domains:
  - domain: dinkydash.co
    type: PRIMARY
  - domain: www.dinkydash.co
    type: ALIAS
  # The dashboard. DNS-only in Cloudflare: a proxied CNAME answers as Cloudflare
  # and App Platform's certificate never issues.
  #
  # A response from here still carries a `cf-ray`, and that is **not** evidence
  # the proxy got switched on: App Platform is itself served through
  # Cloudflare, and its own `.ondigitalocean.app` hostname resolves into
  # Cloudflare's ranges. Check the zone's `proxied` flag, not the headers.
  - domain: app.dinkydash.co
    type: ALIAS

# App-level, so the service, the worker and the migration job all see them
# without three copies to keep in step.
envs:
  - key: DINKYDASH_MODE
    scope: RUN_TIME
    value: cloud
  # Which hostname wsgi.py hands to the dashboard. Not defaulted in code: a typo
  # here would leave the dashboard silently unreachable behind a 404 from the
  # marketing site, so it refuses to start instead.
  - key: DINKYDASH_APP_HOST
    scope: RUN_TIME
    value: app.dinkydash.co
  # What the canonical tags, og:url and the sitemap claim to be.
  - key: DINKYDASH_SITE_URL
    scope: RUN_TIME
    value: https://dinkydash.co
  # In cloud mode the session is the login, so the app refuses to start on the
  # self-hosted fallback key.
  - key: DINKYDASH_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  # DigitalOcean's pool, transaction mode, port 25061.
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  # The cluster itself, port 25060. Migrations and pg_dump want a real session,
  # not the far end of a transaction pooler.
  - key: DATABASE_URL_DIRECT
    scope: RUN_TIME
    type: SECRET
  # The worker's, for the daily brief. The web service never calls Anthropic.
  - key: ANTHROPIC_API_KEY
    scope: RUN_TIME
    type: SECRET
  # Send-only, scoped to mail.send and nothing else.
  - key: SENDGRID_API_KEY
    scope: RUN_TIME
    type: SECRET
  # Who may open /admin, the operator's page (DIN-37): a comma-separated list
  # of account addresses. Not a credential — but an address is personal data
  # and this file is public, the same reason the logs record a domain and
  # never an address — so it is merged in from `.env` like the secrets above.
  # **Put it in `.env` before the next apply**, or the merge snippet in the
  # header fails on the missing key. Unset means nobody can open the page.
  - key: DINKYDASH_ADMIN_EMAILS
    scope: RUN_TIME
    type: SECRET
  # Where error reports and the worker's check-ins go (DIN-35, DIN-54):
  # `dinkydash/sentry.py`, in both the service and the worker. A DSN is not a
  # password — its holder can only *send* events — but it is not published
  # either, because a public DSN is an invitation to fill the project with
  # junk. Merged in from `.env` like the secrets above; unset means nothing is
  # initialised and nothing leaves the container. Reports are labelled with
  # `SENTRY_ENVIRONMENT` if set, else "production" — a local drill sets it,
  # so its check-ins never stand in for the real worker's.
  - key: SENTRY_DSN
    scope: RUN_TIME
    type: SECRET

  # The spend breaker (DIN-43), in model calls a day. Written out at their
  # defaults rather than left implicit, because a ceiling nobody can see is a
  # ceiling nobody raises — and because **this spec is the whole app**: a value
  # changed in the dashboard is undone by the next `doctl apps update`, so an
  # emergency change made there belongs here as well, the same day.
  #
  # `0` everywhere is the brake. It refuses every model call and leaves every
  # dashboard exactly as it is, which is the right shape for "stop the bill now".
  - key: DINKYDASH_FAMILY_CALLS_A_DAY
    scope: RUN_TIME
    value: "12"
  - key: DINKYDASH_GLOBAL_CALL_FLOOR
    scope: RUN_TIME
    value: "50"
  - key: DINKYDASH_GLOBAL_CALLS_PER_FAMILY
    scope: RUN_TIME
    value: "4"

# A failed build or deploy is the platform's own alert (DIN-54): zero code, and
# it fires exactly when `db.ready` refuses to start on a wrong DATABASE_URL, or
# a migration fails in the pre-deploy job. The two things this cannot see — a
# worker that has stopped, and a site that is up but broken — are Sentry's: the
# worker's cron monitor and an uptime check on app.dinkydash.co/login.
alerts:
  - rule: DEPLOYMENT_FAILED

services:
  # Named `site` rather than `web` because renaming a component destroys and
  # recreates it, and the name is not worth an outage on the pages that rank.
  - name: site
    github:
      repo: caspii/dinkydash
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: python

    # requirements-cloud.txt is the superset: it pulls in requirements-site.txt,
    # which pulls in requirements.txt, so one file installs everything this
    # container runs. The buildpack installs requirements.txt on its own, which
    # is deliberately the smaller list — a Pi needs neither Postgres nor a
    # Markdown renderer.
    build_command: pip install -r requirements-cloud.txt

    # **The access log format is a security control, not a preference.** A magic
    # link is a bearer credential, and gunicorn's default `%(r)s` writes the whole
    # request line — path *and* query string — to the platform's log, where it is
    # kept and read. `%(U)s` is the path alone, so the sign-in link's `?t=` never
    # lands there. That is why `web/routes/auth.py` puts the token in the query
    # string rather than in the path, and why `tests/test_auth.py` fails if this
    # line grows a `%(r)s` or a `%(q)s` back.
    #
    # `%(f)s` is the Referer, which cannot carry the token either: every response
    # sets `Referrer-Policy: no-referrer` (DIN-32).
    #
    # `web.routes.auth.NoTokens` scrubs `?t=` from the `gunicorn.access` logger
    # as well, which is what covers the window this file cannot: `deploy_on_push`
    # rebuilds components from new code and does **not** apply a changed spec, so
    # a merge without a `doctl apps update` leaves the default format running.
    run_command: >-
      gunicorn --workers 2 --threads 4 --bind 0.0.0.0:8080
      --access-logfile -
      --access-logformat '%(h)s %(l)s %(u)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s "%(f)s" "%(a)s"'
      "wsgi:application"

    # Component-scoped, because `_self` means nothing in the app-level block
    # above. `${_self.COMMIT_HASH}` is a *bindable* variable: App Platform
    # sets nothing in the environment on its own, so `/healthz` reported
    # `"commit": "unknown"` on every deploy until this was bound. It is how
    # you tell which code is actually running when a fix appears not to have
    # shipped — `deploy_on_push` and `doctl apps update` are separate events,
    # and this repo has already been caught out by that twice.
    envs:
      - key: GIT_SHA
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}

    # 1 GB, not 0.5. Two gunicorn workers each kept ~250 MB after parsing an
    # 8 MB personal calendar, and on 10 September 2026 that took the container
    # past 512 MB and killed it — the site down for a minute, nothing in the log
    # but the exit. `calendars._trim` now keeps the parse to a fortnight, so the
    # headroom is for the next feed shape nobody has measured. $10 a month
    # rather than $5; still the basic tier, still no autoscaling.
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    http_port: 8080

    # The check arrives on the .ondigitalocean.app hostname, which is in no
    # `domains` block above — so wsgi.py sends unknown hosts to the marketing
    # site, which answers /healthz. A 404 here would roll every deploy back.
    health_check:
      http_path: /healthz
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3

workers:
  # The tick, once every five minutes, over every family that is due. Its own
  # component rather than a thread in `site` because there is no lock on the
  # tick in cloud mode: two processes would both refresh and both pay Anthropic
  # for the same brief. One worker, however many web instances.
  #
  # After every completed pass the worker sends one check-in to Sentry's cron
  # monitor (`dinkydash/sentry.py`, DIN-54): a slug, `ok` and a duration. The
  # monitor expects the next one within DINKYDASH_WORKER_INTERVAL (300 s in
  # code when unset) with twice that as grace, and a missed one is the alert.
  # The interval is read from the environment each pass and rides along on
  # the check-in, so setting it here retunes the monitor on the next pass.
  - name: worker
    github:
      repo: caspii/dinkydash
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: python
    build_command: pip install -r requirements-cloud.txt
    run_command: python -m worker
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  # Runs before the new code is live, so the schema is always ahead of what
  # needs it and a failed migration fails the deploy instead of half-updating a
  # running app. `migrate.py` with no argument reads DATABASE_URL_DIRECT.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: caspii/dinkydash
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: python
    build_command: pip install -r requirements-cloud.txt
    run_command: python migrate.py
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
